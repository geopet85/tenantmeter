name: CLI checks
on:
  push:
    paths: ['packages/cli/**', 'lib/tenant/**', 'lib/scans/aggregate.ts', 'tests/**', 'lib/providers/types.ts', 'docs/examples/**', '.nvmrc', '.github/workflows/cli.yml']
  pull_request:
    paths: ['packages/cli/**', 'lib/tenant/**', 'lib/scans/aggregate.ts', 'tests/**', 'lib/providers/types.ts', 'docs/examples/**', '.nvmrc', '.github/workflows/cli.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '${{ matrix.node }}'
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run package:check
