name: Release CLI
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/cli.yml
  live:
    needs: checks
    runs-on: ubuntu-latest
    environment: cloud-tests
    strategy:
      fail-fast: false
      matrix:
        provider: [s3, r2]
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:live:required
        env:
          RUN_LIVE: '1'
          TENANTMETER_ALLOW_TEST_WRITES: '1'
          TENANTMETER_TEST_PROVIDER: ${{ matrix.provider }}
          TENANTMETER_TEST_BUCKET: ${{ matrix.provider == 's3' && vars.S3_TEST_BUCKET || vars.R2_TEST_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_JURISDICTION: ${{ vars.R2_JURISDICTION }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  publish:
    needs: [checks, live]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.5.1
      - run: npm ci
      - run: node scripts/release-check.mjs "$RELEASE_TAG" --remote
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm audit --omit=dev
      - run: npm run package:check
      - run: npm publish --access public
